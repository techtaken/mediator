name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Also run the live Gemini evals (needs the GEMINI_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Placeholders only: offline tests never reach Supabase or Gemini.
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SECRET_KEY: ci-placeholder
      GEMINI_API_KEY: test-dummy-gemini-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -m "not live" -q

  frontend:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Generates the route types (LayoutProps, PageProps) tsc needs.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint app components lib
      - run: npx next build

  evals:
    name: Live evals (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m evals.run --out evals/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/evals/reports/
